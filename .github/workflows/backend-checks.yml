name: Backend checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-test-key-never-use-for-a-deployed-application
      DJANGO_DEBUG: "True"
      DATABASE_URL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Check Django configuration
        run: python backend/manage.py check
      - name: Check committed migrations
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Collect static assets
        run: python backend/manage.py collectstatic --noinput
      - name: Run tests
        run: python -m pytest -q
