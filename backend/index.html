<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLFlowPro - Movie Review Sentiment Analysis</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js library for rendering the canvas chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="container">
    <h1>🎬 MLFlowPro Sentiment Classifier</h1>

    <!-- 1. Review Inference Form -->
    <div class="card">
      <h2>1. Live Review Inference</h2>
      <form id="review-form">
        <label for="review-input"><strong>Enter Movie Review:</strong></label>
        <textarea id="review-input" rows="4" placeholder="e.g., The acting was brilliant and the story kept me engaged throughout!" required></textarea>
        
        <label for="model-select"><strong>Select Model Baseline:</strong></label>
        <select id="model-select">
          <option value="naive_bayes">Multinomial Naive Bayes</option>
          <option value="logistic_regression">Logistic Regression</option>
        </select>

        <button type="submit" id="submit-btn">Analyze Sentiment</button>
      </form>

      <div id="result-container" class="result-card hidden">
        <h3>Prediction Result:</h3>
        <span id="result-sentiment" class="badge"></span>
        <p id="result-confidence" class="confidence-text"></p>
      </div>
    </div>

    <!-- 2. Experiment Metrics Dashboard -->
    <div class="card">
      <h2>2. Model Performance Dashboard</h2>
      
      <div class="dashboard-summary">
        <div class="metric-card">
          <h3>Latest Model Accuracy</h3>
          <p id="accuracy-value">--%</p>
        </div>
      </div>

      <button id="refresh-metrics-btn">Refresh MLflow Runs</button>
      
      <table class="metrics-table">
        <thead>
          <tr>
            <th>Model</th>
            <th>Accuracy</th>
            <th>F1 Score</th>
          </tr>
        </thead>
        <tbody id="metrics-table-body">
          <tr><td colspan="3" class="placeholder-text">Click "Refresh MLflow Runs" to fetch logged experiment data.</td></tr>
        </tbody>
      </table>

      <div class="chart-container" style="margin-top: 25px;">
        <canvas id="metricsChart"></canvas>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
